[project]
name = "imperialhouseholdagency"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "discord-py>=2.7.1",
    "greenlet==3.5.6",
    "injector>=0.24.0",
    "logfire>=5.6.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-ulid>=4.2.0",
    "sentry-sdk>=2.75.0",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[tool.ruff]
exclude = [
  "migration/"
]

[tool.pytest.ini_options]
addopts = "--cov=./src --cov-report=xml --cov-report=term-missing"
testpaths = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/test_*.py",
    "*/conftest.py",
    "migration/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    # External service initialization modules (require actual external services)
    "src/system/infrastructure/ext/logfire/init.py",
    "src/system/infrastructure/ext/sentry/init.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
